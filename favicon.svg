<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="gemCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#083344" />
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outer -->
  <path d="M32 4 L57 17.5 L57 46.5 L32 60 L7 46.5 L7 17.5 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#goldRim)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Hex Inset Line -->
  <path d="M32 8 L53 19.5 L53 44.5 L32 56 L11 44.5 L11 19.5 Z" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="1" 
        stroke-opacity="0.35" 
        stroke-linejoin="round" />

  <!-- Subtle Ambient Glow Behind Crown -->
  <circle cx="32" cy="34" r="14" fill="#F59E0B" opacity="0.12" filter="url(#bloom)" />

  <!-- Grandmaster Imperial Crown -->
  <path d="M17 43 L17 28 L24.5 34 L32 18 L39.5 34 L47 28 L47 43 Z" 
        fill="url(#crownGold)" 
        stroke="#FEF08A" 
        stroke-width="1.2" 
        stroke-linejoin="round" 
        filter="url(#bloom)" />

  <!-- Crown Base Gemstone Band -->
  <rect x="17" y="41" width="30" height="4.5" rx="2" fill="#92400E" stroke="#FDE68A" stroke-width="0.8" />
  
  <!-- Crown Jewels -->
  <circle cx="21" cy="43.25" r="1.2" fill="#F43F5E" />
  <circle cx="26.5" cy="43.25" r="1.2" fill="#38BDF8" />
  <circle cx="32" cy="43.25" r="1.4" fill="#34D399" />
  <circle cx="37.5" cy="43.25" r="1.2" fill="#38BDF8" />
  <circle cx="43" cy="43.25" r="1.2" fill="#F43F5E" />

  <!-- Spire Orbs -->
  <circle cx="17" cy="28" r="2.2" fill="#FDE68A" stroke="#B45309" stroke-width="0.8" />
  <circle cx="47" cy="28" r="2.2" fill="#FDE68A" stroke="#B45309" stroke-width="0.8" />
  
  <!-- Central Spire Sovereignty Diamond -->
  <polygon points="32,14 35.5,18 32,22 28.5,18" fill="url(#gemCyanGlow)" stroke="#E0F2FE" stroke-width="0.8" />
  
  <!-- Star Burst Highlight on Crown Peak -->
  <path d="M32 14 L33 17 L36 18 L33 19 L32 22 L31 19 L28 18 L31 17 Z" fill="#FFFFFF" opacity="0.85" />
</svg>
